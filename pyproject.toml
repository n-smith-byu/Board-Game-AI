[project]
name = "board-game-ai"
version = "0.1.0"
description = "AIs to play various Board Games"
authors = [
    {name = "Nicholas Hyrum Smith", email = "nicholas.smith0014@gmail.com"}
]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.12,<3.15"

dependencies = [
    "torch>=2.9.1",
    "numpy>=2.4.0",
    "tqdm>=4.67.1",
    "torch-geometric>=2.7.0"
]

[tool.poetry]
package-mode = false

[tool.poetry.group.dev.dependencies]
# Use 'path' dependencies to link your internal packages
board_game = { path = "./src/board_game", develop = true }
photosynthesis = { path = "./src/photosynthesis", develop = true }

[tool.poetry.group.examples.dependencies]
jupyter = "^1.1.1"
ipykernel = "^7.2.0"
notebook = "^7.5.6"

[tool.poetry.group.examples]
optional = true

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"